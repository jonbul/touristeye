name: Android APK

# Branches other than main: every push publishes a snapshot APK (pre-release, one per branch, replaced on each push).
# main (a merged PR): publishes a numbered release vX.Y.Z, where X.Y comes from appVersion in gradle.properties
# and Z goes up by one with every release.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          base=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          last=$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          patch=$(( ${last:--1} + 1 ))
          version="${base}.${patch}"
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "main" ]; then
            name="$version"
            tag="v$version"
          else
            slug=$(echo "$branch" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
            name="${version}-SNAPSHOT.${GITHUB_RUN_NUMBER}+${slug}"
            tag="snapshot-${slug}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=touristeye-${name//+/-}.apk" >> "$GITHUB_OUTPUT"
          echo "Version $name, tag $tag"

      - name: Build APK
        run: >
          ./gradlew :composeApp:assembleDebug
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ github.run_number }}

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Name the APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk "${{ steps.version.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}

      - name: Publish snapshot
        if: github.ref_name != 'main'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" "${{ steps.version.outputs.apk }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Snapshot ${{ steps.version.outputs.name }}" \
            --notes "Test build of branch \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Replaced on every push to the branch."

      - name: Publish release
        if: github.ref_name == 'main'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.apk }}" \
            --target "$GITHUB_SHA" --latest \
            --title "Touristeye ${{ steps.version.outputs.name }}" \
            --generate-notes

      # A branch that is deleted after its PR merges leaves its snapshot behind; clear snapshots of deleted
      # branches, and the old build-N releases from before versioning.
      - name: Remove old snapshots
        if: github.ref_name == 'main'
        run: |
          live=$(git ls-remote --heads origin | sed 's#.*refs/heads/##' | while read -r b; do
            echo "$b" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//'; echo; done)
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            case "$tag" in
              snapshot-*) echo "$live" | grep -qx "${tag#snapshot-}" || gh release delete "$tag" --cleanup-tag --yes ;;
              build-*) gh release delete "$tag" --cleanup-tag --yes ;;
            esac
          done
