name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Rename APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk touristeye-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: touristeye-debug-apk
          path: touristeye-debug.apk

      # A release per build on main, so the APK can be downloaded straight from the phone.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Touristeye build ${{ github.run_number }}
          body: Debug APK built from ${{ github.sha }}. Install it on an Android phone (allow installs from unknown sources).
          files: touristeye-debug.apk
