name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > q.txt <<'Q'
          [out:json][timeout:25];
          (
          nwr["tourism"~"^(attraction|museum|viewpoint|artwork|gallery|zoo|theme_park|aquarium)$"]["name"](around:2000,43.3224,-1.9839);
          nwr["historic"~"^(monument|castle|memorial|ruins|archaeological_site|fort|tower|city_gate|palace|manor|church|monastery|ship|aqueduct|bridge)$"]["name"](around:2000,43.3224,-1.9839);
          nwr["amenity"="place_of_worship"]["name"]["wikidata"](around:2000,43.3224,-1.9839);
          nwr["building"~"^(cathedral|basilica)$"]["name"](around:2000,43.3224,-1.9839);
          node["natural"~"^(peak|volcano)$"]["name"](around:2000,43.3224,-1.9839);
          nwr["man_made"~"^(lighthouse|tower)$"]["name"]["wikidata"](around:2000,43.3224,-1.9839);
          );
          out center tags qt 400;
          Q
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $ep"
            curl -sS -m 60 -A "Touristeye/1.0 (AR sightseeing app)" -w "\nHTTP %{http_code} %{time_total}s\n" --data-urlencode data@q.txt "$ep" -o out.json || true
            head -c 300 out.json; echo
            python3 -c "import json,collections;d=json.load(open('out.json'));e=d.get('elements',[]);print('elements',len(e),'remark',d.get('remark'));c=collections.Counter([next((k+'='+t[k] for k in ('tourism','historic','amenity','building','natural','man_made') if k in t),'?') for t in (x.get('tags',{}) for x in e)]);print(c.most_common(25))" || true
          done
          echo "== wikipedia"
          curl -sS -m 30 -A "Touristeye/1.0" "https://es.wikipedia.org/w/api.php?action=query&generator=geosearch&ggscoord=43.3224|-1.9839&ggsradius=2000&ggslimit=10&prop=description|coordinates|pageprops&ppprop=wikibase_item&format=json" | head -c 3000
