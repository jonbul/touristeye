name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          for q in q2000.txt q10000.txt; do
          for ep in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -sS -m 60 -A "Touristeye/1.0 (AR sightseeing app)" -w "::notice title=http $q $ep::%{http_code} %{time_total}s\n" --data-urlencode data@$q "$ep" -o out.json || true
            python3 -c "import json;d=json.load(open('out.json'));print('::notice title=n $q $ep::',len(d.get('elements',[])),d.get('remark'))" || echo "::notice title=n $q $ep::not json"
          done; done
