# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: iosApp
options:
  bundleIdPrefix: com.touristeye
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: "" # set your Apple team ID here or in Xcode > Signing & Capabilities
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Touristeye
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64, magnetometer, gps]
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Touristeye shows the camera image with the names of the places you are looking at.
        NSLocationWhenInUseUsageDescription: Touristeye uses your location to find the sights around you and where they are.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touristeye.ios
        PRODUCT_NAME: Touristeye
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
